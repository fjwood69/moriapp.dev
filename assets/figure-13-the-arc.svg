<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1410" viewBox="0 0 900 1410">
  
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eef0e8"></stop><stop offset="100%" stop-color="#dde0d6"></stop></linearGradient>
    <pattern id="g13" width="22" height="22" patternUnits="userSpaceOnUse"><line x1="22" y1="0" x2="22" y2="22" stroke="rgba(0,0,0,0.035)" stroke-width="1"></line><line x1="0" y1="22" x2="22" y2="22" stroke="rgba(0,0,0,0.035)" stroke-width="1"></line></pattern>
    <filter id="glow13" x="-200%" y="-50%" width="500%" height="200%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
  </defs>
  <rect width="900" height="1410" fill="url(#bg13)"></rect>
  <rect width="900" height="1410" fill="url(#g13)"></rect>
  <g stroke="#cdc9bc" stroke-width="1" fill="none"><path d="M12 22 L12 12 L22 12"></path><path d="M878 12 L888 12 L888 22"></path><path d="M12 1388 L12 1398 L22 1398 M878 1398 L888 1398 L888 1388"></path></g>
  
    <text x="40" y="64" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="27" font-weight="500" letter-spacing="-0.04em" fill="#112418">The arc</text>
    <text x="860" y="50" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" letter-spacing="0.12em" fill="#8a8f8a">森 · HOW WE GOT HERE</text>
    <text x="40" y="88" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" fill="#46514c">Five turns. Each one an assumption overturned by data — not opinion. We set out to build X; the data told us to build Y.</text>
    <text x="40" y="116" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="9.5" letter-spacing="0.04em" fill="#8a8f8a">↓ each pivot below carries the finding that broke the turn before it</text>
  <rect x="56" y="152" width="788" height="128" rx="12" fill="rgba(255,255,255,0.5)" stroke="rgba(0,0,0,0.08)" stroke-width="1"></rect><rect x="56" y="152" width="4" height="128" rx="2" fill="#3f8a6a"></rect><text x="82" y="196" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#3f8a6a" opacity="0.55">01</text><text x="132" y="194" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="0.02em" fill="#3f8a6a">MEMORY</text><text x="816" y="182" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE INTENT</text><text x="132" y="216" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">Agents forget everything between sessions. Give them a shared memory that persists — store</text><text x="132" y="232" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">and retrieve.</text><text x="132" y="254" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">The simple version. Where everyone starts.</text><line x1="60" y1="280" x2="60" y2="336" stroke="#8a8f8a" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"></line><polygon points="56,328 64,328 60,335" fill="#1f6a4a"></polygon><rect x="120" y="294" width="284" height="26" rx="13" fill="#eef0e8" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"></rect><text x="138" y="311" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" fill="#112418"><tspan fill="#1f6a4a" font-weight="600">↳ </tspan>“raw memory only ties a hand-written file”</text><rect x="56" y="336" width="788" height="164" rx="12" fill="rgba(255,255,255,0.5)" stroke="rgba(0,0,0,0.08)" stroke-width="1"></rect><rect x="56" y="336" width="4" height="164" rx="2" fill="#1f6a4a"></rect><text x="82" y="380" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#1f6a4a" opacity="0.55">02</text><text x="132" y="378" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="0.02em" fill="#1f6a4a">CURATION</text><text x="816" y="366" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE DISCOVERY</text><text x="132" y="400" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">The first benchmark said raw memory barely helps — auto-extraction merely tied a</text><text x="132" y="416" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">hand-written file. The lever was never having memory; it was a human deciding what is worth</text><text x="132" y="432" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">keeping.</text><text x="132" y="454" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">→ The product became the gate, not the store.</text><rect x="132" y="463" width="383.2" height="19" rx="9.5" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.10)" stroke-width="1"></rect><text x="144" y="476" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" fill="#8a8f8a"><tspan fill="#1f6a4a" font-weight="600" letter-spacing="0.08em">RECEIPT </tspan> auto-extraction ≈ hand-written file · multiple benchmarks</text><line x1="60" y1="500" x2="60" y2="556" stroke="#8a8f8a" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"></line><polygon points="56,548 64,548 60,555" fill="#155640"></polygon><rect x="120" y="514" width="308" height="26" rx="13" fill="#eef0e8" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"></rect><text x="138" y="531" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" fill="#112418"><tspan fill="#155640" font-weight="600">↳ </tspan>“a human approving memories = maker / checker”</text><rect x="56" y="556" width="788" height="148" rx="12" fill="rgba(255,255,255,0.5)" stroke="rgba(0,0,0,0.08)" stroke-width="1"></rect><rect x="56" y="556" width="4" height="148" rx="2" fill="#155640"></rect><text x="82" y="600" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#155640" opacity="0.55">03</text><text x="132" y="598" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="0.02em" fill="#155640">GOVERNANCE</text><text x="816" y="586" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE DISCOVERY</text><text x="132" y="620" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">“A human approves memories” turned out to be maker / checker — the exact control culture FSI</text><text x="132" y="636" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">already runs. Not a feature. A compliance posture.</text><text x="132" y="658" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">→ Nothing enters institutional memory without a named human and an audit trail.</text><rect x="132" y="667" width="321.59999999999997" height="19" rx="9.5" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.10)" stroke-width="1"></rect><text x="144" y="680" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" fill="#8a8f8a"><tspan fill="#155640" font-weight="600" letter-spacing="0.08em">RECEIPT </tspan> maker / checker = existing FSI control culture</text><line x1="60" y1="704" x2="60" y2="790" stroke="#8a8f8a" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"></line><polygon points="56,782 64,782 60,789" fill="#8a6420"></polygon><line x1="96" y1="726" x2="804" y2="726" stroke="rgba(0,0,0,0.2)" stroke-width="1" stroke-dasharray="1 5"></line><text x="450" y="722" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="9.5" font-style="italic" letter-spacing="0.02em" fill="#8a8f8a">the product stopped being about memory — and started being about risk</text><rect x="120" y="742" width="452" height="26" rx="13" fill="#eef0e8" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"></rect><text x="138" y="759" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" fill="#112418"><tspan fill="#8a6420" font-weight="600">↳ </tspan>“governance didn’t make it faster — but it stopped the silent failure”</text><rect x="56" y="790" width="788" height="164" rx="12" fill="rgba(255,255,255,0.5)" stroke="rgba(0,0,0,0.08)" stroke-width="1"></rect><rect x="56" y="790" width="4" height="164" rx="2" fill="#8a6420"></rect><text x="82" y="834" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#8a6420" opacity="0.55">04</text><text x="132" y="832" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="0.02em" fill="#8a6420">INSURANCE</text><text x="816" y="820" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE DISCOVERY</text><text x="132" y="854" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">The flagship experiment nulled — governance didn’t make agents faster. But three separate</text><text x="132" y="870" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">studies kept showing the same thing: it stops the silent failure that would otherwise ship.</text><text x="132" y="892" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">→ Not acceleration. Insurance — you pay the premium and see nothing, until the day it saves</text><text x="132" y="908" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">you.</text><rect x="132" y="917" width="360.79999999999995" height="19" rx="9.5" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.10)" stroke-width="1"></rect><text x="144" y="930" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" fill="#8a8f8a"><tspan fill="#8a6420" font-weight="600" letter-spacing="0.08em">RECEIPT </tspan> phantom-API 20/20→0/20 — wrong-scope memory causes harm, scoping prevents it</text><line x1="60" y1="954" x2="60" y2="1010" stroke="#8a8f8a" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"></line><polygon points="56,1002 64,1002 60,1009" fill="#3f5d7e"></polygon><rect x="120" y="968" width="362" height="26" rx="13" fill="#eef0e8" stroke="rgba(0,0,0,0.2)" stroke-width="1.2"></rect><text x="138" y="985" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="10" fill="#112418"><tspan fill="#3f5d7e" font-weight="600">↳ </tspan>“harm doesn’t sort by capability — it flips run-to-run”</text><rect x="56" y="1010" width="788" height="180" rx="12" fill="rgba(255,255,255,0.5)" stroke="rgba(0,0,0,0.08)" stroke-width="1"></rect><rect x="56" y="1010" width="4" height="180" rx="2" fill="#3f5d7e"></rect><text x="82" y="1054" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#3f5d7e" opacity="0.55">05</text><text x="132" y="1052" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="21" font-weight="600" letter-spacing="0.02em" fill="#3f5d7e">UNPREDICTABILITY</text><text x="816" y="1040" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE DEEPEST FINDING</text><text x="132" y="1074" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">Agent harm doesn’t sort by capability, and it flips run-to-run. The best coding model broke</text><text x="132" y="1090" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">the build every time. The same model did the right thing, then the wrong thing, on identical</text><text x="132" y="1106" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11" fill="#46514c">input.</text><text x="132" y="1128" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">→ You can’t pick a safe agent. You can’t predict a safe run. Which is the entire reason a</text><text x="132" y="1144" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="11.5" font-weight="600" fill="#112418">governance layer that depends on neither has to exist.</text><rect x="132" y="1153" width="472.79999999999995" height="19" rx="9.5" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.10)" stroke-width="1"></rect><text x="144" y="1166" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" fill="#8a8f8a"><tspan fill="#3f5d7e" font-weight="600" letter-spacing="0.08em">RECEIPT </tspan> fleet migration (#3) · top coding model broke 100% · run-to-run variance on identical input</text>
  <rect x="56" y="1206" width="788" height="164" rx="12" fill="rgba(63,93,126,0.06)" stroke="rgba(63,93,126,0.35)" stroke-width="1.2"></rect><rect x="56" y="1206" width="4" height="164" rx="2" fill="#3f5d7e"></rect><text x="120" y="1236" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="8.5" letter-spacing="0.14em" fill="#8a8f8a">THE SYNTHESIS</text><text x="120" y="1260" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="13" font-weight="600" fill="#112418">We set out to give agents memory.</text><text x="120" y="1282" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="12.5" font-weight="500" fill="#46514c">We discovered the product was governing it —</text><text x="120" y="1304" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="12.5" font-weight="500" fill="#46514c">because you can’t trust what an agent learns,</text><text x="120" y="1326" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="12.5" font-weight="500" fill="#46514c">can’t predict how it’ll behave,</text><text x="120" y="1348" font-family="&#39;JetBrains Mono&#39;, ui-monospace, &#39;SF Mono&#39;, Menlo, monospace" font-size="12.5" font-weight="600" fill="#112418">and the only thing that holds is a human gate with the receipts.</text>
</svg>