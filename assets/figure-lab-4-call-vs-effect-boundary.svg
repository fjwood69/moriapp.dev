<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#e8eae1"></rect><text x="40" y="50" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#8a8a8a">FIGURE 1 · CALL BOUNDARY vs EFFECT BOUNDARY</text><text x="40" y="84" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1A1A">The hook watches calls. The harm crossed as a computation.</text><text x="40" y="110" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" fill="#555">Same file, two routes. The in-loop hook covers one. The promotion gate reads the artifact, where both look identical.</text><rect x="52" y="231" width="140" height="54" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="122" y="262.9" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Agent → shell</text><text x="290" y="162" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#8B0000">PATH A · WATCHED</text><line x1="192" y1="247" x2="286" y2="202" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="286,202 282.1,206.6 280.0,202.2" fill="#1A1A1A"></polygon><rect x="290" y="178" width="170" height="48" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="375" y="206.6" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="13" font-weight="400" fill="#1A1A1A">edit file</text><line x1="460" y1="202" x2="483" y2="202" stroke="#8B0000" stroke-width="1.4"></line><polygon points="483,202 477.5,204.4 477.5,199.6" fill="#8B0000"></polygon><circle cx="500" cy="202" r="15" fill="#fff" stroke="#8B0000" stroke-width="2"></circle><line x1="493" y1="195" x2="507" y2="209" stroke="#8B0000" stroke-width="2.2"></line><text x="500" y="176" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8B0000">hook fires — call seen</text><line x1="516" y1="202" x2="794" y2="208" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="2 4"></line><polygon points="794,208 788.5,210.3 788.6,205.4" fill="#8a8a8a"></polygon><text x="656" y="194" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#8a8a8a">blocked — never lands</text><text x="250" y="310" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#1A1A1A">PATH B · UNWATCHED</text><line x1="122" y1="285" x2="122" y2="349" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="122,349 119.6,343.5 124.4,343.5" fill="#1A1A1A"></polygon><line x1="122" y1="349" x2="246" y2="349" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="246,349 240.5,351.4 240.5,346.6" fill="#1A1A1A"></polygon><rect x="250" y="326" width="120" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="310" y="346.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">write</text><text x="310" y="360.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">helper.py</text><line x1="370" y1="349" x2="383" y2="349" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="383,349 377.5,351.4 377.5,346.6" fill="#1A1A1A"></polygon><rect x="386" y="326" width="120" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="446" y="346.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">run</text><text x="446" y="360.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">helper.py</text><line x1="506" y1="349" x2="519" y2="349" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="519,349 513.5,351.4 513.5,346.6" fill="#1A1A1A"></polygon><rect x="522" y="326" width="120" height="46" rx="5" fill="#fff6ef" stroke="#E65100" stroke-width="1.3"></rect><text x="582" y="346.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="600" fill="#E65100">helper mutates</text><text x="582" y="360.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="600" fill="#E65100">file at runtime</text><line x1="642" y1="349" x2="655" y2="349" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="655,349 649.5,351.4 649.5,346.6" fill="#1A1A1A"></polygon><rect x="658" y="326" width="120" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="718" y="346.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">delete</text><text x="718" y="360.2" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" font-weight="400" fill="#1A1A1A">helper.py</text><circle cx="446" cy="292" r="13" fill="#fff" stroke="#8B0000" stroke-width="1.8"></circle><circle cx="446" cy="292" r="4" fill="#8B0000"></circle><line x1="446" y1="305" x2="446" y2="324" stroke="#8B0000" stroke-width="1.4" stroke-dasharray="3 3"></line><polygon points="446,324 443.6,318.5 448.4,318.5" fill="#8B0000"></polygon><text x="446" y="261" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="700" fill="#8B0000">hook sees a program run,</text><text x="446" y="274" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="700" fill="#8B0000">not the write</text><text x="582" y="392" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-style="italic" fill="#E65100">the harm crosses here — inside the run</text><rect x="800" y="178" width="160" height="60" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="880" y="213.3" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">committed file</text><text x="880" y="256" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#8a8a8a">both paths converge —</text><text x="880" y="269" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#8a8a8a">identical final state</text><line x1="778" y1="349" x2="850" y2="241" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="850,241 849.0,246.9 844.9,244.2" fill="#1A1A1A"></polygon><line x1="880" y1="280" x2="880" y2="467" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="880,467 877.6,461.5 882.4,461.5" fill="#1A1A1A"></polygon><rect x="800" y="470" width="160" height="60" rx="5" fill="#eef1ea" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="880" y="505.3" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">promotion gate</text><text x="880" y="547" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#555">reads what was produced,</text><text x="880" y="560" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#555">not how</text><line x1="40" y1="584" x2="960" y2="584" stroke="#c9c9c9" stroke-width="1"></line><text x="40" y="608" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A"><tspan font-weight="700">Coverage topology, not a bug.</tspan> The hook fires correctly on the call it can see. But the mutation on Path B never appears as a file-write call —</text><text x="40" y="626" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A">it happens as a computation inside a program run. Only the gate, reading committed state, treats both paths the same.</text></svg>