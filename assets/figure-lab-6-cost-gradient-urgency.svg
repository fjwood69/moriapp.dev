0" y="308.5" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8B0000">calm / business-as-usual</text><text x="650" y="324.5" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#8a8a8a">skip-rate rises with cost</text><text x="650" y="349.2" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#9E9E9E">ecological (pooled) · corroboration</text><text x="650" y="459.5" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2E7D32">urgency / “ship it now”</text><text x="650" y="475.5" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#8a8a8a">stays low even as cost climbs</text><line x1="634" y1="310.5" x2="634" y2="455.5" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2 3"></line><text x="624" y="383" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-style="italic" fill="#1A1A1A">the gap</text><text x="110" y="166" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#1A1A1A">urgency reduced skipping — the dangerous case is the calm one.</text><line x1="40" y1="562" x2="880" y2="562" stroke="#c9c9c9" stroke-width="1"></line></svg>