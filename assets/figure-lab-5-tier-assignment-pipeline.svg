<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="864" viewBox="0 0 920 864"><rect width="920" height="864" fill="#e8eae1"></rect><text x="40" y="50" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#8a8a8a">FIGURE 2 · THE TIER-ASSIGNMENT PIPELINE</text><text x="40" y="84" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1A1A">Tiers are assigned by a mechanical pipeline, not judgement.</text><text x="40" y="110" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" fill="#555">Every candidate runs the same two tests. Where it fails determines its tier — and all three tiers carry equal weight.</text><rect x="95" y="152" width="210" height="46" rx="23" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="200" y="180" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">candidate check</text><line x1="200" y1="198" x2="200" y2="237" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="200,237 197.6,231.5 202.4,231.5" fill="#1A1A1A"></polygon><rect x="75" y="240" width="250" height="50" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></rect><text x="200" y="270" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A">compile to a deterministic check</text><line x1="200" y1="290" x2="200" y2="327" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="200,327 197.6,321.5 202.4,321.5" fill="#1A1A1A"></polygon><polygon points="200,330 340,388 200,446 60,388" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></polygon><text x="200" y="377.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">survives red-teaming</text><text x="200" y="392.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">(can’t be obfuscated</text><text x="200" y="407.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">past)?</text><line x1="340" y1="388" x2="617" y2="388" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="617,388 611.5,390.4 611.5,385.6" fill="#1A1A1A"></polygon><text x="480" y="380" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E7D32">YES</text><rect x="620" y="355" width="250" height="66" rx="5" fill="#fff" stroke="#2E7D32" stroke-width="2"></rect><rect x="620" y="355" width="6" height="66" rx="3" fill="#2E7D32"></rect><text x="642" y="382" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em" fill="#2E7D32">ENFORCEABLE</text><text x="642" y="403" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#555">blocks the merge, deterministically</text><line x1="200" y1="446" x2="200" y2="515" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="200,515 197.6,509.5 202.4,509.5" fill="#1A1A1A"></polygon><text x="216" y="486" text-anchor="start" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" fill="#555">NO</text><polygon points="200,518 340,576 200,634 60,576" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.3"></polygon><text x="200" y="565.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">can be made to run</text><text x="200" y="580.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">in a hermetic</text><text x="200" y="595.4" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" fill="#1A1A1A">clean room?</text><line x1="340" y1="576" x2="617" y2="576" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="617,576 611.5,578.4 611.5,573.6" fill="#1A1A1A"></polygon><text x="480" y="568" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c5a8a">YES</text><rect x="620" y="543" width="250" height="66" rx="5" fill="#fff" stroke="#1c5a8a" stroke-width="2"></rect><rect x="620" y="543" width="6" height="66" rx="3" fill="#1c5a8a"></rect><text x="642" y="570" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em" fill="#1c5a8a">VERIFIABLE</text><text x="642" y="591" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#555">clean-room verdict gates the merge</text><text x="642" y="605" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#8a8a8a">within coverage limits</text><line x1="200" y1="634" x2="200" y2="695" stroke="#1A1A1A" stroke-width="1.4"></line><polygon points="200,695 197.6,689.5 202.4,689.5" fill="#1A1A1A"></polygon><text x="216" y="670" text-anchor="start" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" fill="#555">NO</text><rect x="75" y="698" width="250" height="66" rx="5" fill="#fff" stroke="#E65100" stroke-width="2"></rect><rect x="75" y="698" width="6" height="66" rx="3" fill="#E65100"></rect><text x="97" y="725" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.04em" fill="#E65100">ADVISABLE</text><text x="97" y="746" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#555">surfaced to the accountable human</text><line x1="40" y1="812" x2="880" y2="812" stroke="#c9c9c9" stroke-width="1"></line><text x="40" y="836" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A"><tspan font-weight="700">Advisable is a category, not a failure.</tspan> A rule lands in the tier its check can support — enforce what survives red-teaming,</text><text x="40" y="854" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A">verify what runs clean, advise the rest. No tier is lesser; each matches the strength of evidence available.</text></svg>