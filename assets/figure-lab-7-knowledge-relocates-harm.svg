<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760"><rect width="920" height="760" fill="#e8eae1"></rect><text x="40" y="50" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#8a8a8a">FIGURE 4 · KNOWLEDGE RELOCATES HARM</text><text x="40" y="84" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1A1A">Surfacing the rule didn’t prevent the harm — it moved it.</text><text x="40" y="110" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" fill="#555">For one model, being told the constraint didn’t remove the harm — it relocated it, onto the safeguard itself.</text><rect x="40" y="150" width="430" height="350" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"></rect><text x="62" y="180" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">The relocation</text><text x="62" y="198" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#E65100">initial signal round · n = 10</text><line x1="290" y1="176" x2="308" y2="176" stroke="#8B0000" stroke-width="2.6"></line><circle cx="299" cy="176" r="3.2" fill="#8B0000"></circle><text x="314" y="180" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="700" fill="#8B0000">guard modification · 4→8</text><line x1="290" y1="194" x2="308" y2="194" stroke="#9E9E9E" stroke-width="2.4"></line><circle cx="299" cy="194" r="3.2" fill="#9E9E9E"></circle><text x="314" y="198" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#9E9E9E">blind break · 6→0</text><line x1="104" y1="434" x2="430" y2="434" stroke="#1A1A1A" stroke-width="1.3"></line><text x="94" y="438" text-anchor="end" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#8a8a8a">0</text><line x1="104" y1="387" x2="430" y2="387" stroke="#dcdcd4" stroke-width="1"></line><text x="94" y="391" text-anchor="end" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#8a8a8a">2</text><line x1="104" y1="340" x2="430" y2="340" stroke="#dcdcd4" stroke-width="1"></line><text x="94" y="344" text-anchor="end" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#8a8a8a">4</text><line x1="104" y1="293" x2="430" y2="293" stroke="#dcdcd4" stroke-width="1"></line><text x="94" y="297" text-anchor="end" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#8a8a8a">6</text><line x1="104" y1="246" x2="430" y2="246" stroke="#dcdcd4" stroke-width="1"></line><text x="94" y="250" text-anchor="end" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="11" fill="#8a8a8a">8</text><text x="154" y="454" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">unaware</text><text x="154" y="468" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">of the rule</text><text x="390" y="454" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">told</text><text x="390" y="468" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">the rule</text><line x1="154" y1="293" x2="390" y2="434" stroke="#9E9E9E" stroke-width="2.4"></line><circle cx="154" cy="293" r="4" fill="#9E9E9E"></circle><circle cx="390" cy="434" r="4" fill="#9E9E9E"></circle><line x1="154" y1="340" x2="390" y2="246" stroke="#8B0000" stroke-width="2.6"></line><circle cx="154" cy="340" r="4" fill="#8B0000"></circle><circle cx="390" cy="246" r="5" fill="#8B0000"></circle><text x="62" y="496" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#8a8a8a">the fall and the rise cross — one harm replaced another.</text><rect x="500" y="150" width="380" height="196" rx="8" fill="#ffffff" stroke="#8B0000" stroke-width="2"></rect><rect x="500" y="150" width="6" height="196" rx="3" fill="#8B0000"></rect><text x="528" y="184" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#8a8a8a">THE PRE-REGISTERED RESULT</text><text x="526" y="262" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="72" font-weight="700" fill="#8B0000">32<tspan font-size="40" fill="#555"> / 50</tspan></text><text x="528" y="296" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">runs modified the read-only reconcile guard</text><text x="528" y="320" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12" fill="#555">pre-registered replication · n = 50</text><text x="502" y="380" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A"><tspan font-weight="700">Relocation, not elimination.</tspan></text><text x="502" y="400" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" fill="#555">The blind break fell toward zero once the fact was</text><text x="502" y="418" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" fill="#555">surfaced — but guard modification rose to take its place.</text><line x1="40" y1="520" x2="880" y2="520" stroke="#c9c9c9" stroke-width="1"></line><text x="40" y="546" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#8a8a8a">DISPOSITION, NOT CAPABILITY</text><line x1="90" y1="594" x2="760" y2="594" stroke="#1A1A1A" stroke-width="1.2"></line><polygon points="760,594 752,590 752,598" fill="#1A1A1A"></polygon><text x="90" y="620" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#8a8a8a">less capable</text><text x="760" y="620" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#8a8a8a">more capable →</text><circle cx="230" cy="594" r="7" fill="#8B0000"></circle><text x="230" y="578" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#8B0000">Haiku 4.5</text><text x="230" y="638" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="600" fill="#8B0000">relocated</text><text x="230" y="652" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="9.5" fill="#8a8a8a">n = 50</text><circle cx="500" cy="594" r="6" fill="none" stroke="#2E7D32" stroke-width="1.6"></circle><path d="M 497 594 l 2.2 2.4 l 4.2 -5" fill="none" stroke="#2E7D32" stroke-width="1.6"></path><text x="500" y="578" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1A1A1A">Sonnet 4.6</text><text x="500" y="638" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#2E7D32">stayed clean</text><text x="500" y="652" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="9.5" fill="#8a8a8a">fewer runs</text><circle cx="690" cy="594" r="6" fill="none" stroke="#2E7D32" stroke-width="1.6"></circle><path d="M 687 594 l 2.2 2.4 l 4.2 -5" fill="none" stroke="#2E7D32" stroke-width="1.6"></path><text x="690" y="578" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1A1A1A">Gemini 3.1 Pro·High</text><text x="690" y="638" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" fill="#2E7D32">stayed clean</text><text x="690" y="652" text-anchor="middle" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="9.5" fill="#8a8a8a">fewer runs</text><text x="40" y="690" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#8a8a8a">Of eight agents given the same fact, only Haiku 4.5 relocated. The two more-capable models stayed clean. Cells are not equal-weight —</text><text x="40" y="706" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#8a8a8a">the Haiku cell is n = 50; other agents were run at far fewer, and one family (Kimi K2) was excluded. No equal-n comparison is implied.</text><line x1="40" y1="724" x2="880" y2="724" stroke="#c9c9c9" stroke-width="1"></line><text x="40" y="746" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A"><tspan font-weight="700">Surfacing the rule didn’t prevent the harm</tspan> — it moved it onto the safeguard, on the model you’d least expect from capability alone.</text></svg>