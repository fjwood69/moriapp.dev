<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="812" viewBox="0 0 920 812"><rect width="920" height="812" fill="#e8eae1"></rect><text x="40" y="50" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.14em" fill="#8a8a8a">FIGURE 5 · THE GOVERNED PERIMETER — AND WHERE IT STOPS</text><text x="40" y="84" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="23" font-weight="700" fill="#1A1A1A">Governance is recursive — and honest about its edge.</text><text x="40" y="110" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" fill="#555">Every component trust depends on is governed by a lower one — until the chain reaches a root the framework declares, not proves.</text><rect x="144" y="166" width="652" height="356" rx="8" fill="#eef2ea" stroke="#c9c9c9" stroke-width="1"></rect><text x="158" y="184" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#2E7D32">GOVERNED — DECLARED, PINNED, REVALIDATED</text><line x1="118" y1="196" x2="118" y2="500" stroke="#555" stroke-width="1.4"></line><polygon points="118,500 114,492 122,492" fill="#555"></polygon><text transform="translate(106 345) rotate(-90)" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" fill="#555">each layer governed by the one beneath it</text><rect x="170" y="190" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="190" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="210" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">1</text><text x="214" y="214" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">Oracle</text><text x="754" y="214" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">the verdict logic</text><path d="M 465 238 L 470 243 L 475 238" fill="none" stroke="#8a8a8a" stroke-width="1.3"></path><rect x="170" y="244" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="244" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="264" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">2</text><text x="214" y="268" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">Differential run</text><text x="754" y="268" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">pinned vs PR oracle · escalate on divergence</text><path d="M 465 292 L 470 297 L 475 292" fill="none" stroke="#8a8a8a" stroke-width="1.3"></path><rect x="170" y="298" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="298" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="318" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">3</text><text x="214" y="322" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">CI config on the protected ref</text><text x="754" y="322" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">the runner</text><path d="M 465 346 L 470 351 L 475 346" fill="none" stroke="#8a8a8a" stroke-width="1.3"></path><rect x="170" y="352" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="352" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="372" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">4</text><text x="214" y="376" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">Credential hygiene</text><text x="754" y="376" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">the protected ref itself</text><path d="M 465 400 L 470 405 L 475 400" fill="none" stroke="#8a8a8a" stroke-width="1.3"></path><rect x="170" y="406" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="406" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="426" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">5</text><text x="214" y="430" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">IAM</text><text x="754" y="430" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">credentials</text><path d="M 465 454 L 470 459 L 475 454" fill="none" stroke="#8a8a8a" stroke-width="1.3"></path><rect x="170" y="460" width="600" height="46" rx="5" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2"></rect><rect x="170" y="460" width="5" height="46" rx="2.5" fill="#2E7D32"></rect><text x="190" y="480" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">6</text><text x="214" y="484" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1A1A1A">Identity Provider</text><text x="754" y="484" text-anchor="end" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="11.5" fill="#555">IAM</text><line x1="40" y1="556" x2="880" y2="556" stroke="#1A1A1A" stroke-width="4"></line><rect x="342" y="541" width="236" height="30" rx="15" fill="#1A1A1A"></rect><text x="460" y="561" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.08em" fill="#fff">GOVERNANCE STOPS HERE</text><text x="44" y="544" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#2E7D32">↑ what this framework governs</text><text x="44" y="578" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#555">↓ assumed, not proven — the trust root</text><rect x="90" y="596" width="740" height="66" rx="6" fill="#d7d3c7" stroke="#b7b2a4" stroke-width="1.3"></rect><text x="114" y="626" font-family="&#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="10" fill="#8a8a8a">7</text><text x="134" y="626" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1A1A">Cloud provider · kernel · hardware root of trust</text><text x="134" y="646" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12" fill="#555">the Identity Provider — assumed as the trust root, declared rather than proven</text><text x="460" y="690" text-anchor="middle" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#555">Every architecture bottoms out here — BeyondCorp does not prove the kernel. This is candour, not a gap.</text><line x1="40" y1="768" x2="880" y2="768" stroke="#c9c9c9" stroke-width="1"></line><text x="40" y="788" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A"><tspan font-weight="700">The chain is recursive and honest about its edge</tspan> — it extends to the protected ref, the credential scope, the runner</text><text x="40" y="804" font-family="Helvetica, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="13.5" fill="#1A1A1A">attestation, and it stops there, on an assumed root it declares rather than pretends to prove.</text></svg>